name: Backup

# Weekly SQL dump of the D1 database into the private R2 bucket `dancecalendar-backups` (eu).
# Eight slots, overwritten in turn, keep the last 8 weeks without listing or pruning: the newest is the
# one with the latest upload time. Restore steps: .scratch/dance-calendar-mvp/issues/26-retention-and-backups.md

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays, 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    concurrency: backup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 export dancecalendar --remote --output dump.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload to the week's slot
        run: |
          slot=$(( $(date +%s) / 604800 % 8 ))
          npx wrangler r2 object put "dancecalendar-backups/d1-slot-$slot.sql" --file dump.sql --remote --jurisdiction eu --content-type application/sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
